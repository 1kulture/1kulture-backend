      role:
        enum:
        - co_host
        - manager
        - staff
        type: string
      user_id:
        type: string
    required:
    - role
    - user_id
    type: object
  requests.CreateAffiliateCodeRequest:
    properties:
      brand_commission_bps:
        description: Commission the brand earns per conversion (in bps of the order
