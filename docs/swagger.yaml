basePath: /api/v1
definitions:
  github_com_1kulture_1kulture-backend_internal_requests.ChangePasswordRequest:
    properties:
      current_password:
        maxLength: 72
        minLength: 8
        type: string
      new_password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - current_password
    - new_password
    type: object
  github_com_1kulture_1kulture-backend_internal_requests.ForgotPasswordRequest:
    properties:
      email:
        maxLength: 255
        type: string
    required:
    - email
    type: object
  github_com_1kulture_1kulture-backend_internal_requests.KYCRequest:
    properties:
      address_proof_url:
        maxLength: 500
        type: string
      business_name:
        maxLength: 255
        minLength: 2
        type: string
      business_reg_number:
        maxLength: 100
        minLength: 5
        type: string
      document_number:
        maxLength: 100
        minLength: 5
        type: string
      document_type:
        enum:
        - national_id
        - passport
        - drivers_license
        - business_registration
        type: string
      document_url:
        maxLength: 500
        type: string
      role_id:
        type: string
      selfie_url:
        maxLength: 500
        type: string
    required:
    - address_proof_url
    - document_number
    - document_type
    - document_url
    - role_id
    - selfie_url
    type: object
  github_com_1kulture_1kulture-backend_internal_requests.LogoutRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  github_com_1kulture_1kulture-backend_internal_requests.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  github_com_1kulture_1kulture-backend_internal_requests.ResendVerificationRequest:
    properties:
      email:
        maxLength: 255
        type: string
    required:
    - email
    type: object
  github_com_1kulture_1kulture-backend_internal_requests.ResetPasswordRequest:
    properties:
      new_password:
        maxLength: 72
        minLength: 8
        type: string
      token:
        type: string
    required:
    - new_password
    - token
    type: object
  github_com_1kulture_1kulture-backend_internal_requests.SignInRequest:
    properties:
      email:
        maxLength: 255
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  github_com_1kulture_1kulture-backend_internal_requests.SignUpRequest:
    properties:
      accept_terms:
        type: boolean
      email:
        maxLength: 255
        type: string
      first_name:
        maxLength: 100
        minLength: 2
        type: string
      last_name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      phone_number:
        maxLength: 20
        minLength: 10
        type: string
      role:
        enum:
        - guest
        - vendor
        - event_manager
        type: string
    required:
    - accept_terms
    - email
    - first_name
    - last_name
    - password
    type: object
  github_com_1kulture_1kulture-backend_internal_requests.UpdateProfileRequest:
    properties:
      avatar_url:
        maxLength: 500
        type: string
      first_name:
        maxLength: 100
        minLength: 2
        type: string
      last_name:
        maxLength: 100
        minLength: 2
        type: string
      phone_number:
        maxLength: 20
        minLength: 10
        type: string
    type: object
  github_com_1kulture_1kulture-backend_internal_requests.UpdateRoleRequest:
    properties:
      role:
        enum:
        - vendor
        - event_manager
        type: string
    required:
    - role
    type: object
  github_com_1kulture_1kulture-backend_internal_requests.VerifyEmailRequest:
    properties:
      code:
        type: string
      email:
        maxLength: 255
        type: string
    required:
    - code
    - email
    type: object
  github_com_1kulture_1kulture-backend_internal_requests.WaitlistRequest:
    properties:
      category:
        example: event_planner
        maxLength: 100
        minLength: 2
        type: string
      email:
        example: user@example.com
        maxLength: 255
        type: string
    required:
    - category
    - email
    type: object
  github_com_1kulture_1kulture-backend_internal_responses.AuthResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
      user:
        $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.UserResponse'
    type: object
  github_com_1kulture_1kulture-backend_internal_responses.ErrorDetail:
    properties:
      code:
        type: string
      details: {}
      message:
        type: string
    type: object
  github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorDetail'
      request_id:
        type: string
      success:
        type: boolean
      timestamp:
        type: string
    type: object
  github_com_1kulture_1kulture-backend_internal_responses.KYCResponse:
    properties:
      address_proof_url:
        type: string
      business_name:
        type: string
      business_reg_number:
        type: string
      document_number:
        type: string
      document_type:
        type: string
      document_url:
        type: string
      id:
        type: string
      rejection_reason:
        type: string
      reviewed_at:
        type: string
      role_id:
        type: string
      role_name:
        type: string
      selfie_url:
        type: string
      status:
        type: string
      submitted_at:
        type: string
      user_id:
        type: string
    type: object
  github_com_1kulture_1kulture-backend_internal_responses.Meta:
    properties:
      has_next:
        type: boolean
      has_prev:
        type: boolean
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  github_com_1kulture_1kulture-backend_internal_responses.Response:
    properties:
      data: {}
      error: {}
      message:
        type: string
      meta:
        $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.Meta'
      request_id:
        type: string
      success:
        type: boolean
      timestamp:
        type: string
    type: object
  github_com_1kulture_1kulture-backend_internal_responses.RoleResponse:
    properties:
      description:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  github_com_1kulture_1kulture-backend_internal_responses.TokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  github_com_1kulture_1kulture-backend_internal_responses.UserResponse:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      email:
        type: string
      email_verified_at:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_login_at:
        type: string
      last_name:
        type: string
      phone_number:
        type: string
      roles:
        items:
          $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.RoleResponse'
        type: array
      status:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@1kulture.com
    name: API Support
    url: https://1kulture.com/support
  description: Enterprise Event Management System API with multi-tenant SaaS architecture
  license:
    name: Proprietary
    url: https://1kulture.com/license
  termsOfService: https://1kulture.com/terms
  title: 1Kulture API
  version: "1.0"
paths:
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Change password for authenticated user
      parameters:
      - description: Change password request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_requests.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password changed successfully
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.Response'
        "400":
          description: Invalid password
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - auth
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Send password reset email
      parameters:
      - description: Forgot password request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_requests.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password reset email sent
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.Response'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
      summary: Request password reset
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revoke refresh token
      parameters:
      - description: Logout request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_requests.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Logged out successfully
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.Response'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
        "401":
          description: Invalid token
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
      summary: Logout user
      tags:
      - auth
  /auth/refresh-token:
    post:
      consumes:
      - application/json
      description: Get new access token using refresh token
      parameters:
      - description: Refresh token request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_requests.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Token refreshed successfully
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.TokenResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
        "401":
          description: Invalid refresh token
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
      summary: Refresh access token
      tags:
      - auth
  /auth/resend-verification:
    post:
      consumes:
      - application/json
      description: Resend email verification code
      parameters:
      - description: Resend verification request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_requests.ResendVerificationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Verification code sent
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.Response'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
      summary: Resend verification code
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Reset password using token
      parameters:
      - description: Reset password request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_requests.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password reset successfully
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.Response'
        "400":
          description: Invalid or expired token
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
      summary: Reset password
      tags:
      - auth
  /auth/signin:
    post:
      consumes:
      - application/json
      description: Authenticate user and get tokens
      parameters:
      - description: Sign in request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_requests.SignInRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Signed in successfully
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.AuthResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
      summary: Sign in a user
      tags:
      - auth
  /auth/signup:
    post:
      consumes:
      - application/json
      description: Create a new user account
      parameters:
      - description: Sign up request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_requests.SignUpRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Account created successfully
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.AuthResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
        "409":
          description: Email already registered
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
      summary: Register a new user
      tags:
      - auth
  /auth/verify-email:
    post:
      consumes:
      - application/json
      description: Verify email with 6-digit code
      parameters:
      - description: Verify email request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_requests.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Email verified successfully
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.Response'
        "400":
          description: Invalid verification code
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
      summary: Verify email address
      tags:
      - auth
  /users/kyc:
    post:
      consumes:
      - application/json
      description: Submit KYC documents for verification
      parameters:
      - description: KYC request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_requests.KYCRequest'
      produces:
      - application/json
      responses:
        "201":
          description: KYC submitted successfully
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.KYCResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Submit KYC verification
      tags:
      - users
  /users/kyc/status:
    get:
      consumes:
      - application/json
      description: Get KYC verification status
      produces:
      - application/json
      responses:
        "200":
          description: KYC status retrieved successfully
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.KYCResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get KYC status
      tags:
      - users
  /users/profile:
    get:
      consumes:
      - application/json
      description: Get authenticated user's profile
      produces:
      - application/json
      responses:
        "200":
          description: Profile retrieved successfully
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Update authenticated user's profile
      parameters:
      - description: Update profile request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_requests.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Profile updated successfully
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.UserResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update user profile
      tags:
      - users
  /users/role:
    post:
      consumes:
      - application/json
      description: Add a new role to user
      parameters:
      - description: Update role request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_requests.UpdateRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Role updated successfully
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.Response'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
        "422":
          description: Validation error
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_responses.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update user role
      tags:
      - users
  /waitlist:
    post:
      consumes:
      - application/json
      description: Add email and category to waitlist
      parameters:
      - description: Waitlist request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_1kulture_1kulture-backend_internal_requests.WaitlistRequest'
      produces:
      - application/json
      responses:
        "201":
