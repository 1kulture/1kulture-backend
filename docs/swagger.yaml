        type: string
      gallery:
        items:
          type: string
        maxItems: 10
        type: array
      refund_policy:
        type: string
      refund_policy_days:
        maximum: 365
        minimum: 0
        type: integer
      start_at:
        type: string
      summary:
        example: The biggest tech gathering in West Africa.
        maxLength: 500
        type: string
      tags:
        items:
          type: string
        maxItems: 20
        type: array
      thumbnail_url:
        maxLength: 500
        type: string
      timezone:
        example: Africa/Lagos
        type: string
      title:
        example: Lagos Tech Summit 2026
        maxLength: 255
        minLength: 3
        type: string
      venue_address:
        maxLength: 500
        type: string
      venue_city:
        maxLength: 100
        type: string
      venue_country:
        maxLength: 100
        type: string
      venue_lat:
        type: number
      venue_lng:
        type: number
      venue_name:
