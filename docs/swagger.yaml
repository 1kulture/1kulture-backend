basePath: /api/v1
definitions:
  requests.AcceptTransferRequest:
    properties:
      token:
        minLength: 20
        type: string
    required:
    - token
    type: object
  requests.BulkUpdateSettingsRequest:
    properties:
      settings:
        items:
          $ref: '#/definitions/requests.UpdateSettingRequest'
        minItems: 1
        type: array
    required:
    - settings
    type: object
  requests.ChangePasswordRequest:
    properties:
      current_password:
        maxLength: 72
        minLength: 8
        type: string
      new_password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - current_password
    - new_password
    type: object
  requests.CheckInRequest:
    properties:
      device_info:
        maxLength: 255
        type: string
      location:
        maxLength: 255
        type: string
      qr_payload:
        minLength: 10
        type: string
    required:
    - qr_payload
    type: object
  requests.CoOrganizerAddRequest:
    properties:
      permissions:
        additionalProperties: true
