        maxLength: 255
        type: string
      venue_postal_code:
        maxLength: 20
        type: string
      venue_state:
        maxLength: 100
        type: string
      virtual_platform:
        maxLength: 100
        type: string
      virtual_url:
        description: Virtual fields (required for virtual/hybrid)
        maxLength: 500
        type: string
      visibility:
        enum:
        - public
        - unlisted
        - private
