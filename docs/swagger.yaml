        minimum: 0
        type: integer
      code:
        maxLength: 50
        minLength: 3
        type: string
      per_user_limit:
        minimum: 0
        type: integer
      type:
        description: Promo semantics
        enum:
        - percentage
        - fixed
        type: string
      usage_limit:
        minimum: 0
        type: integer
      value_minor:
        minimum: 1
        type: integer
    required:
    - brand_commission_bps
    - code
    - type
    - value_minor
    type: object
  requests.CreateBrandProfileRequest:
    properties:
      business_name:
        maxLength: 255
        minLength: 2
        type: string
      business_size:
        enum:
        - startup
        - small
        - medium
        - large
        - enterprise
        type: string
      contact_email:
        maxLength: 255
        type: string
      contact_name:
        maxLength: 255
        minLength: 2
        type: string
      contact_phone:
        maxLength: 30
        minLength: 7
        type: string
      description:
        maxLength: 2000
        type: string
      industry:
        maxLength: 100
        minLength: 2
        type: string
      instagram:
        maxLength: 100
        type: string
      location:
        maxLength: 255
        minLength: 2
        type: string
      logo_url:
        maxLength: 500
        type: string
      preferred_categories:
        items:
          type: string
        maxItems: 20
        type: array
      tags:
        items:
          type: string
        maxItems: 20
        type: array
      target_audience:
        maxLength: 2000
        type: string
      website:
        maxLength: 500
