      description:
        maxLength: 500
        type: string
      is_public:
        type: boolean
      key:
        example: custom.setting
        maxLength: 100
        minLength: 2
        type: string
      value:
        type: string
      value_type:
        enum:
        - string
        - int
        - bool
        - json
        - duration
        example: string
        type: string
    required:
    - key
    - value
    - value_type
    type: object
  requests.DeclineTransferRequest:
    properties:
      token:
