    properties:
      is_active:
        type: boolean
      max_revenue_minor:
        minimum: 0
        type: integer
      min_revenue_minor:
        example: 0
        minimum: 0
        type: integer
      name:
        example: New Organizer
        maxLength: 100
        minLength: 2
        type: string
      priority:
        minimum: 0
        type: integer
      rate_bps:
        description: 7%
        example: 700
        maximum: 10000
        minimum: 0
        type: integer
    required:
    - name
    - rate_bps
    type: object
  requests.CreateCurrencyRequest:
    properties:
      code:
        example: NGN
        type: string
      is_default:
        type: boolean
      is_enabled:
        type: boolean
      min_amount_minor:
        minimum: 0
        type: integer
